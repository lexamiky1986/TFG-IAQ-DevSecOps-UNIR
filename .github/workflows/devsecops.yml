name: Pipeline DevSecOps IAQ - UNIR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sast-y-docker:
    name: SAST (Bandit) y Contenedor Docker
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias y Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escaneo SAST con Bandit
        run: |
          bandit -r app/ -f txt
          bandit -r app/ -f json -o bandit-report.json

      - name: Guardar reporte Bandit
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Construir imagen Docker Non-Root
        run: docker build -t iaq-backend-unir:latest .
